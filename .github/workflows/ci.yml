name: Continuous Integration (CI)

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # 1. Pruebas Unitarias del Cliente Next.js & Vitest
  test-client:
    name: Test Client App (Next.js & Vitest)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./client

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: './client/package-lock.json'

      - name: Install Dependencies
        run: npm ci

      - name: Run Vitest Unit & Integration Tests
        env:
          JWT_SECRET: "fallback-secret-key-famvote-2026"
        run: npm run test

      - name: Next.js Build Check
        env:
          NEXT_PUBLIC_API_GATEWAY_VOTE_URL: "https://api.famvote.com/vote"
        run: npm run build

  # 2. Pruebas Unitarias de la Lambda (Python)
  test-lambda:
    name: Test Lambda Worker (Python)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          cd lambda
          python -m pip install --upgrade pip
          pip install pytest boto3 "moto[dynamodb,sqs]"

      - name: Run Pytest
        run: |
          cd lambda
          pytest -v

  # 3. Validación de Infraestructura (Terraform)
  validate-terraform:
    name: Validate Terraform IaC
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.0

      - name: Terraform Format Check
        run: |
          cd terraform/production
          terraform fmt -check

      - name: Terraform Init & Validate
        env:
          AWS_ACCESS_KEY_ID: "mock_key"
          AWS_SECRET_ACCESS_KEY: "mock_secret"
          AWS_DEFAULT_REGION: "us-east-1"
        run: |
          cd terraform/production
          terraform init -backend=false -input=false
          terraform validate