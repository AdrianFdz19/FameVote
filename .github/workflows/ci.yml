name: Continuous Integration (CI)

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # 1. Pruebas Unitarias de la Lambda (Python)
  test-lambda:
    name: Test Lambda Worker (Python)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          cd lambda
          python -m pip install --upgrade pip
          pip install pytest boto3 "moto[dynamodb,sqs]"

      - name: Run Pytest
        run: |
          cd lambda
          pytest -v

  # 2. Validación de Infraestructura (Terraform)
  validate-terraform:
    name: Validate Terraform IaC
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.0

      - name: Terraform Format Check
        run: |
          cd terraform
          terraform fmt -check

      - name: Terraform Init & Validate
        run: |
          cd terraform
          terraform init -backend=false
          terraform validate