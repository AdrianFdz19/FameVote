version: '3'

services:

  postgres:
    image: postgres:18-alpine 
    container_name: postgres_container
    environment:
      POSTGRES_USER: my-POSTGRES_USER 
      POSTGRES_PASSWORD: dev_password 
      POSTGRES_DB: auth_db 
    ports:
      "5432: 5433" 
    volumes:
      - postgres_data:/var/lib/postgresql/data
    
  redis:
    image: redis:15-alpine 
    container_name: redis_container
    environment:
      REDIS_USER: my-redis-user 
    ports:
      "6379: 6379"
    volumes:
      -redis_data:/data

volumes:
  postgres_data:
  redis_data: